# Voice command node parameters (laptop).
# Model retains baseline; STT temperature and VAD start ratio use development results.
# Change values here for
# experiments instead of editing code; record results in tools/voice_eval/results/.
voice_command_node:
  ros__parameters:
    # false = run the full pipeline but never publish (dry run).
    publish_commands: true
    # Save processed utterances only when collecting evaluation/debug data.
    save_recordings: false
    recordings_dir: "~/2026project/recordings"

    capture:
      queue_capacity: 2            # completed utterances, excluding current processing
      max_fetch_age_seconds: 10.0   # VAD end -> publication; stop is exempt

    audio_stop:
      mode: "off"                 # off / shadow (log only) / active (experimental)
      model_dir: "~/.cache/eated/ko-kws-zipformer-tiny/c2430dd975019802a68077e0fc4dd0521ae193e9"
      threshold: 0.01
      score: 1.0
      queue_frames: 128           # absorb bounded PulseAudio delivery bursts
      max_lag_seconds: 0.5        # local frame read -> decision, not microphone latency

    whisper:
      model: "small"
      device: "cpu"
      compute_type: "int8"
      language: "ko"
      beam_size: 5
      initial_prompt: ""
      hotwords: ""
      temperatures: [0.0]         # no stochastic fallback; keep beam 5 and empty hints

    vad:
      mode: 3                      # WebRTC aggressiveness 0-3
      start_min_rms: 200           # noise gate while waiting for speech
      stream_warmup_ms: 1200       # discarded once when the mic stream first opens
      start_window_ms: 300
      start_speech_ratio: 0.4      # 4 of 10 frames; short-stop replay + live/noise checks
      end_silence_ms: 900          # 5.1 ②: try 500-600 and measure
      pre_roll_ms: 450
      max_utterance_seconds: 15.0

    llm:
      ollama_url: "http://127.0.0.1:11434"
      model: "qwen3:4b-instruct"
      timeout_seconds: 10.0        # also bounded by remaining fetch age
      keep_alive: -1              # integer: keep model resident after requests
      warmup_timeout_seconds: 120.0
      retry_seconds: 5.0          # retry only after the previous HTTP call finishes

    robot:
      response_timeout_seconds: 5.0  # no automatic retransmission or unlock on timeout
      connection_poll_seconds: 0.5   # DDS graph check; state is not a heartbeat

    messages:
      llm_preparing: "명령 처리 준비 중이에요. 준비 완료 후 다시 말씀해 주세요."
      llm_ready: "명령 처리 준비가 완료됐어요. 말씀해 주세요."
      llm_failure: "명령을 처리하지 못했어요. 준비 완료 후 다시 말씀해 주세요."
      robot_unknown: "로봇 상태를 확인하고 있어요. 상태 확인 후 다시 말씀해 주세요."
      robot_busy: "지금 작업 중이에요."
      robot_error: "로봇 상태를 확인하고 복구해 주세요."
      robot_pending: "앞서 보낸 명령의 처리 결과를 기다리고 있어요."
      robot_before_idle: "작업 가능 상태가 되기 전 요청이에요. 다시 말씀해 주세요."
      robot_response_timeout: "로봇 응답을 확인하지 못했어요. 로봇 상태를 확인해 주세요."
      robot_invalid_timing: "요청 시간을 확인하지 못했어요. 다시 말씀해 주세요."
      robot_expired: "요청 유효시간이 지났어요. 다시 말씀해 주세요."
      robot_accepted: "{object} 가져올게요."
      robot_rejected: "로봇이 요청을 거절했어요. 상태를 확인해 주세요."
      robot_carrying: "{object}를 집었어요."
      robot_stop_sent: "정지 명령을 보냈어요."
      robot_stop_accepted: "로봇이 정지 요청을 수락했어요."
      robot_send_error: "명령 전달 여부를 확인하지 못했어요. 로봇 상태를 확인해 주세요."
      robot_unknown_command: "할 수 없는 명령이에요."
      robot_dry_run: "시험 모드: 명령을 발행하지 않았어요."
